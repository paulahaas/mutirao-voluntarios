<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quero ser parceiro — Mutirão Comunitário</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html"><img src="assets/logo-floripa-cor.png" alt="">Mutirão Comunitário</a>
    <div class="nav-tabs">
      <a href="index.html">Início</a>
      <a href="qrcodes.html">QR Codes</a>
      <a href="painel.html">Painel</a>
    </div>
  </div>
</nav>

<main class="page">
  <span class="eyebrow">Cadastro de parceiro</span>
  <h1>Quero ser parceiro</h1>
  <p class="muted">Para empresas e instituições que querem apoiar o mutirão com recursos, materiais, divulgação ou mão de obra.</p>

  <form id="form" class="card stack" novalidate>

    <div class="honeypot" aria-hidden="true">
      <label for="site">Deixe em branco</label>
      <input type="text" id="site" name="site" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="empresa">Nome da empresa / instituição</label>
      <input class="input" type="text" id="empresa" name="empresa" required>
    </div>

    <div class="field">
      <label for="responsavel">Nome do responsável</label>
      <input class="input" type="text" id="responsavel" name="responsavel" required autocomplete="name">
    </div>

    <div class="row" style="align-items: flex-start; gap: 16px;">
      <div class="field" style="flex: 1; min-width: 220px;">
        <label for="email">E-mail</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field" style="flex: 1; min-width: 220px;">
        <label for="telefone">Telefone</label>
        <input class="input" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required autocomplete="tel">
      </div>
    </div>

    <div class="field">
      <label>Como sua empresa/instituição pode apoiar?</label>
      <span class="hint">Pode marcar mais de uma opção.</span>
      <div class="choice-grid" id="apoio-grid"></div>
    </div>

    <div class="field" id="campo-outro-apoio" style="display:none;">
      <label for="outroApoio">Qual tipo de apoio?</label>
      <input class="input" type="text" id="outroApoio" name="outroApoio" placeholder="Descreva o tipo de apoio">
    </div>

    <div class="field">
      <label for="descricao">Detalhes do apoio oferecido</label>
      <textarea id="descricao" name="descricao" required placeholder="Ex: 50L de tinta disponíveis, caminhão para transporte no dia, contatos de divulgação..."></textarea>
    </div>

    <div class="field">
      <label for="observacoes">Observações <span class="hint">(opcional)</span></label>
      <textarea id="observacoes" name="observacoes"></textarea>
    </div>

    <button class="btn btn--primary btn--block" type="submit">Enviar cadastro</button>
    <div id="status" class="form-status" role="status" aria-live="polite"></div>
  </form>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-logo"><img id="footer-logo-img" hidden></div>
    <div class="footer-text">
      <span class="eyebrow">Sobre nós</span>
      <p id="footer-descricao"></p>
      <a id="footer-link" href="#" target="_blank" rel="noopener" hidden>Saiba mais →</a>
    </div>
  </div>
</footer>

<script src="config.js"></script>
<script src="js/footer.js"></script>
<script src="js/backend.js"></script>
<script src="js/form-common.js"></script>
<script>
  // Preenche o checklist de tipos de apoio (múltipla escolha) + "Outro"
  const gridApoio = document.getElementById("apoio-grid");
  CONFIG.parceiro.tiposApoio.forEach((t) => {
    const label = document.createElement("label");
    label.className = "choice";
    label.innerHTML = `<input type="checkbox" name="tipoApoio" value="${t}"><span>${t}</span>`;
    gridApoio.appendChild(label);
  });

  const campoOutroApoio = document.getElementById("campo-outro-apoio");
  gridApoio.addEventListener("change", () => {
    const outroMarcado = gridApoio.querySelector('input[value="Outro"]').checked;
    campoOutroApoio.style.display = outroMarcado ? "flex" : "none";
  });

  ligarFormulario({
    sheet: CONFIG.backend.ABA_PARCEIROS,
    form: document.getElementById("form"),
    status: document.getElementById("status"),
    montarDados: () => {
      const form = document.getElementById("form");
      const dados = new FormData(form);

      let tiposApoio = Array.from(
        form.querySelectorAll('input[name="tipoApoio"]:checked')
      ).map((el) => el.value);
      if (tiposApoio.includes("Outro") && dados.get("outroApoio")) {
        tiposApoio = tiposApoio.filter((t) => t !== "Outro");
        tiposApoio.push(dados.get("outroApoio"));
      }

      return {
        empresa: dados.get("empresa"),
        responsavel: dados.get("responsavel"),
        email: dados.get("email"),
        telefone: dados.get("telefone"),
        tipoParceria: tiposApoio.join(", "),
        descricao: dados.get("descricao"),
        observacoes: dados.get("observacoes") || "",
      };
    },
  });
</script>
</body>
</html>
