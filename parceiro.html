<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quero ser parceiro — Mutirão Comunitário</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640;9..144,680&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">Mutirão Comunitário</a>
    <div class="nav-tabs">
      <a href="index.html">Início</a>
      <a href="qrcodes.html">QR Codes</a>
      <a href="painel.html">Painel</a>
    </div>
  </div>
</nav>

<main class="page">
  <span class="eyebrow">Cadastro de parceiro</span>
  <h1>Quero ser parceiro</h1>
  <p class="muted">Para empresas e instituições que querem apoiar o mutirão com recursos, materiais, divulgação ou mão de obra.</p>

  <form id="form" class="card stack" novalidate>

    <div class="field">
      <label for="empresa">Nome da empresa / instituição</label>
      <input class="input" type="text" id="empresa" name="empresa" required>
    </div>

    <div class="field">
      <label for="responsavel">Nome do responsável</label>
      <input class="input" type="text" id="responsavel" name="responsavel" required autocomplete="name">
    </div>

    <div class="row" style="align-items: flex-start; gap: 16px;">
      <div class="field" style="flex: 1; min-width: 220px;">
        <label for="email">E-mail</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field" style="flex: 1; min-width: 220px;">
        <label for="telefone">Telefone</label>
        <input class="input" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required autocomplete="tel">
      </div>
    </div>

    <div class="field">
      <label for="tipoParceria">Tipo de parceria</label>
      <select class="input" id="tipoParceria" name="tipoParceria" required>
        <option value="" disabled selected>Selecione um tipo</option>
      </select>
    </div>

    <div class="field">
      <label for="descricao">O que sua empresa/instituição pode oferecer?</label>
      <textarea id="descricao" name="descricao" required placeholder="Ex: doação de 50L de tinta, transporte no dia, divulgação nas redes sociais..."></textarea>
    </div>

    <div class="field">
      <label for="observacoes">Observações <span class="hint">(opcional)</span></label>
      <textarea id="observacoes" name="observacoes"></textarea>
    </div>

    <button class="btn btn--primary btn--block" type="submit">Enviar cadastro</button>
    <div id="status" class="form-status" role="status" aria-live="polite"></div>
  </form>
</main>

<script src="config.js"></script>
<script src="js/backend.js"></script>
<script src="js/form-common.js"></script>
<script>
  const selectTipo = document.getElementById("tipoParceria");
  CONFIG.parceiro.tiposParceria.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    selectTipo.appendChild(opt);
  });

  ligarFormulario({
    sheet: CONFIG.backend.ABA_PARCEIROS,
    form: document.getElementById("form"),
    status: document.getElementById("status"),
    montarDados: () => {
      const dados = new FormData(document.getElementById("form"));
      return {
        empresa: dados.get("empresa"),
        responsavel: dados.get("responsavel"),
        email: dados.get("email"),
        telefone: dados.get("telefone"),
        tipoParceria: dados.get("tipoParceria"),
        descricao: dados.get("descricao"),
        observacoes: dados.get("observacoes") || "",
      };
    },
  });
</script>
</body>
</html>
